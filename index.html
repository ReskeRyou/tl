<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кальяны — контроль таймингов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15181d;--panel:#1e232a;--line:#2d343d;--tx:#eef1f4;--mu:#8d97a3;--g:#3ecf8e;--y:#f5c431;--r:#ff5a4f;--ac:#e8e3d3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Onest,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--line);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.primary{background:var(--ac);color:#15181d}
.hidden{display:none!important}
#login{display:grid;place-items:center;min-height:100vh;padding:20px}
#login form{width:100%;max-width:340px;display:grid;gap:12px}
#login h1{margin:0 0 8px;font-size:28px;font-weight:800}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
.err{color:var(--r);min-height:20px;font-size:14px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{margin:0;font-size:18px;font-weight:800}
.tabs{display:flex;gap:6px;padding:12px 16px}
.tabs button{background:var(--panel)}
.tabs button.on{background:var(--ac);color:#15181d}
.grid{display:grid;gap:12px;padding:0 16px 96px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--panel);border-radius:14px;padding:14px;border-left:8px solid var(--g);display:grid;gap:10px}
.card.y{border-color:var(--y)}.card.r{border-color:var(--r)}.card.pend{border-color:var(--r)}
.card.off{border-color:var(--line);opacity:.8}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:800;font-size:17px}
.sub{color:var(--mu);font-size:13px}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.g .big{color:var(--g)}.y .big{color:var(--y)}.r .big{color:var(--r)}
.status{font-weight:600}
.row{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
.alert{background:rgba(245,196,49,.15);border:1px solid var(--y);border-radius:10px;padding:10px;display:grid;gap:8px;font-weight:600}
.alert.red{background:rgba(255,90,79,.18);border-color:var(--r)}
.alert.soon{background:rgba(141,151,163,.12);border-color:var(--mu)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{flex:1}
.ok{background:var(--g);color:#0b1f15}.bad{background:var(--line)}
.tag{font-size:13px;color:var(--mu)}
.empty{color:var(--mu);padding:40px 16px;text-align:center;grid-column:1/-1}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:16px 22px;border-radius:999px;font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:end center;z-index:10}
.sheet{background:var(--panel);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px;display:grid;gap:12px}
.sheet h2{margin:0;font-size:20px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{background:var(--bg);border:2px solid var(--line)}
.opts button.on{border-color:var(--ac)}
</style>
</head>
<body>

<div id="login">
  <form id="lf">
    <h1>Вход</h1>
    <input id="lu" placeholder="Логин" autocomplete="username" autocapitalize="off" required>
    <input id="lp" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <div class="err" id="le"></div>
    <button class="primary" type="submit">Войти</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Кальяны</h1>
    <div class="btns" style="flex:0">
      <button id="all" class="primary">Замена произведена (все)</button>
      <button id="logout">Выйти</button>
    </div>
  </header>
  <div class="tabs">
    <button id="t-hall" class="on">В зале</button>
    <button id="t-off">Отбито</button>
  </div>
  <div class="grid" id="list"></div>
  <button id="fab" class="primary">+ Добавить кальян</button>
</div>

<div id="modal" class="hidden">
  <div class="sheet">
    <h2>Новый кальян</h2>
    <div class="opts" id="types"></div>
    <select id="tbl"></select>
    <div class="err" id="terr"></div>
    <div class="opts" style="grid-template-columns:1fr 1fr" id="whens">
      <button data-w="now" class="on">Сейчас</button>
      <button data-w="manual">Указать время</button>
    </div>
    <input id="tm" type="time" class="hidden">
    <div class="btns"><button id="cancel">Отмена</button><button id="save" class="primary">Добавить</button></div>
  </div>
</div>

<script>
// ===== Настройки (можно менять) =====
// Логин и пароль в коде не хранятся, только хэш.
const AUTH_SALT = 'hk-7f3a91c2', AUTH_ITER = 50000;
const AUTH_HASH = '7722ebb5b4cd6c0d608347d5b269f1ed1a7bbb672a9c7100e48d71400788de34';
function sha256(m){const K=new Uint32Array(64);let p=2,c=0;while(c<64){let ok=true;for(let d=2;d*d<=p;d++)if(p%d==0){ok=false;break}if(ok)K[c++]=Math.floor((Math.cbrt(p)%1)*4294967296);p++}
const H=new Uint32Array(8);p=2;c=0;while(c<8){let ok=true;for(let d=2;d*d<=p;d++)if(p%d==0){ok=false;break}if(ok)H[c++]=Math.floor((Math.sqrt(p)%1)*4294967296);p++}
const l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=128;const dv=new DataView(b.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/536870912));
const w=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
for(let i=16;i<64;i++){const a=w[i-15],e=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(e,17)^r(e,19)^(e>>>10)))>>>0}
let[a,e,f,g,h,i2,j,k]=H;for(let i=0;i<64;i++){const t1=(k+(r(h,6)^r(h,11)^r(h,25))+((h&i2)^(~h&j))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&e)^(a&f)^(e&f)))>>>0;k=j;j=i2;i2=h;h=(g+t1)>>>0;g=f;f=e;e=a;a=(t1+t2)>>>0}
[a,e,f,g,h,i2,j,k].forEach((v,i)=>H[i]=(H[i]+v)>>>0)}
const out=new Uint8Array(32),ov=new DataView(out.buffer);H.forEach((v,i)=>ov.setUint32(i*4,v));return out}
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
function authHash(login,pass){let h=sha256(new TextEncoder().encode(AUTH_SALT+':'+login+':'+pass));for(let i=1;i<AUTH_ITER;i++)h=sha256(h);return hex(h)}
const TYPES = {
  classic:  {name: 'Классика',   offerMin: 60},
  fruit:    {name: 'На фрукте',  offerMin: 90},
  signature:{name: 'Фирменный',  offerMin: 90}
};
const COAL_YELLOW = 15, COAL_RED = 20, EARLY_WARN = 10; // минуты
const DEFAULT_PRICES = {classic: 1500, fruit: 2500, signature: 2000};
// ====================================

const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

const TABLES = [];
for (let i = 1; i <= 9; i++) TABLES.push('Стол ' + i);
TABLES.push('VIP комната');
for (let i = 1; i <= 4; i++) TABLES.push('Кальянный бар ' + i);
for (let i = 1; i <= 4; i++) TABLES.push('Коктейльный ' + i);
$('tbl').innerHTML = '<option value="">Выберите стол</option>' + TABLES.map(t => `<option>${t}</option>`).join('');
let items = load('hk_items', []);
let prices = load('hk_prices', DEFAULT_PRICES);
let tab = 'hall', pickedType = 'classic', pickedWhen = 'now';

const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); return (h ? h + ':' : '') + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60) };
const clock = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) };

// ----- вход -----
function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); render(); }
$('lf').onsubmit = e => {
  e.preventDefault();
  if (authHash($('lu').value.trim(), $('lp').value) === AUTH_HASH) {
    try { localStorage.setItem('hk_auth', AUTH_HASH) } catch {}
    showApp();
  } else $('le').textContent = 'Неверный логин или пароль';
};
$('logout').onclick = () => { try { localStorage.removeItem('hk_auth') } catch {} location.reload(); };
let authed = false;
try { authed = localStorage.getItem('hk_auth') === AUTH_HASH; } catch {}
if (authed) showApp();

// ----- вкладки -----
$('t-hall').onclick = () => { tab = 'hall'; render(); };
$('t-off').onclick = () => { tab = 'off'; render(); };

// ----- добавление -----
$('types').innerHTML = Object.entries(TYPES).map(([k, t]) => `<button data-t="${k}">${t.name}</button>`).join('');
function syncModal() {
  document.querySelectorAll('#types button').forEach(b => b.classList.toggle('on', b.dataset.t === pickedType));
  document.querySelectorAll('#whens button').forEach(b => b.classList.toggle('on', b.dataset.w === pickedWhen));
  $('tm').classList.toggle('hidden', pickedWhen !== 'manual');
}
$('types').onclick = e => { if (e.target.dataset.t) { pickedType = e.target.dataset.t; syncModal(); } };
$('whens').onclick = e => {
  if (!e.target.dataset.w) return;
  pickedWhen = e.target.dataset.w;
  if (pickedWhen === 'manual' && !$('tm').value) $('tm').value = clock(Date.now());
  syncModal();
};
$('fab').onclick = () => { $('tbl').value = ''; $('terr').textContent = ''; pickedWhen = 'now'; syncModal(); $('modal').classList.remove('hidden'); };
$('cancel').onclick = () => $('modal').classList.add('hidden');
$('save').onclick = () => {
  if (!$('tbl').value) { $('terr').textContent = 'Выберите стол'; return; }
  let start = Date.now();
  if (pickedWhen === 'manual' && $('tm').value) {
    const [h, m] = $('tm').value.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1); // время в будущем = вчера
    start = d.getTime();
  }
  items.push({id: Date.now() + '' + Math.random().toString(16).slice(2, 6), type: pickedType, table: $('tbl').value, start, lastChange: start, offer: null, removed: false});
  save('hk_items', items);
  $('modal').classList.add('hidden');
  tab = 'hall'; render();
};

// ----- цены -----
$('all').onclick = () => {
  const now = Date.now();
  items.forEach(i => { if (!i.removed) i.lastChange = now; });
  save('hk_items', items); render();
};

// ----- действия -----
$('list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const it = items.find(x => x.id === b.dataset.id); if (!it) return;
  const a = b.dataset.a;
  if (a === 'change') it.lastChange = Date.now();
  if (a === 'accept') it.offer = 'accepted';
  if (a === 'decline') it.offer = 'declined';
  if (a === 'remove') { it.removed = true; it.removedAt = Date.now(); }
  if (a === 'restore') it.removed = false;
  save('hk_items', items); render();
};

// ----- отрисовка -----
function card(it, now) {
  const t = TYPES[it.type];
  const title = `<div class="top"><span class="name">${t.name}${it.table ? ' · ' + esc(it.table) : ''}</span><span class="sub">внесён ${clock(it.start)}</span></div>`;
  if (it.removed) return `<div class="card off">${title}<div class="sub">Отбит. Прошло с выноса: ${fmt(it.removedAt ? it.removedAt - it.start : now - it.start)}</div><div class="btns"><button data-a="restore" data-id="${it.id}">Вернуть в зал</button></div></div>`;

  const local = (now - it.lastChange) / 60000;
  const glob = (now - it.start) / 60000;
  const cls = local >= COAL_RED ? 'r' : local >= COAL_YELLOW ? 'y' : 'g';
  const status = cls === 'g' ? 'Угли в норме' : cls === 'y' ? 'Требуется замена углей' : 'Замена просрочена';
  const left = t.offerMin - glob;
  const price = (prices[it.type] || 0).toLocaleString('ru-RU') + ' ₽';

  let alert = '', pend = '';
  if (!it.offer) {
    const due = left <= 0;
    const early = !due && local >= COAL_YELLOW && left < EARLY_WARN;
    if (due) pend = 'pend';
    if (due || early) {
      alert = `<div class="alert ${due ? 'red' : 'soon'}"><div>${due ? 'Предложите замену кальяна' : 'Скоро замена кальяна: после этой замены углей останется ' + Math.max(1, Math.ceil(left)) + ' мин. Предложите новый заранее'}</div><div class="sub">Новый кальян: ${price}</div><div class="btns"><button class="ok" data-a="accept" data-id="${it.id}">Принято</button><button class="bad" data-a="decline" data-id="${it.id}">Отклонено</button></div></div>`;
    }
  }
  const offerTag = it.offer ? `<div class="tag">Предложение: ${it.offer === 'accepted' ? 'принято' : 'отклонено'}</div>` : '';

  return `<div class="card ${cls} ${pend}">${title}
    <div class="${cls}"><div class="big">${fmt(now - it.lastChange)}</div><div class="status">${status}</div></div>
    <div class="row"><span>Всего за столом</span><span>${fmt(now - it.start)}</span></div>
    <div class="row"><span>До предложения (${t.offerMin} мин)</span><span>${left > 0 ? fmt(left * 60000) : 'пора'}</span></div>
    ${alert}${offerTag}
    <div class="btns"><button class="primary" data-a="change" data-id="${it.id}">Замена произведена</button><button data-a="remove" data-id="${it.id}" style="flex:0">Убрать</button></div></div>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function render() {
  if ($('app').classList.contains('hidden')) return;
  const now = Date.now();
  $('t-hall').classList.toggle('on', tab === 'hall');
  $('t-off').classList.toggle('on', tab === 'off');
  const hall = items.filter(i => !i.removed), off = items.filter(i => i.removed);
  $('t-hall').textContent = 'В зале (' + hall.length + ')';
  $('t-off').textContent = 'Отбито (' + off.length + ')';
  const shown = tab === 'hall' ? hall : off;
  $('list').innerHTML = shown.length
    ? shown.sort((a, b) => a.start - b.start).map(i => card(i, now)).join('')
    : `<div class="empty">${tab === 'hall' ? 'В зале пока нет кальянов. Нажмите «Добавить кальян».' : 'Здесь появятся убранные кальяны.'}</div>`;
}
let pressed = false;
$('list').addEventListener('pointerdown', () => pressed = true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('list').addEventListener(ev, () => setTimeout(() => pressed = false, 50)));
setInterval(() => { if (!pressed) render(); }, 1000);
</script>
</body>
</html>
